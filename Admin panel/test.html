<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<style>
    body {
        background: #0a1a1a;
        color: #e0f7fa;
        font-family: 'Segoe UI', sans-serif;
    }

    /* Glassy Cards */
    .glassy-card {
        background: rgba(30, 51, 50, 0.6);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 12px;
        border: 1px solid rgba(0, 255, 255, 0.1);
        box-shadow: 0 8px 32px rgba(0, 255, 255, 0.1);
        padding: 2rem;
    }

    .profile-header {
        background: rgba(0, 255, 255, 0.1);
        border-radius: 12px;
        padding: 2rem;
        position: relative;
        text-align: center;
    }

    .profile-header img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 3px solid #0ff;
        box-shadow: 0 0 10px #0ff;
    }

    .profile-header h2 {
        margin-top: 1rem;
        color: #0ff;
        text-shadow: 0 0 6px #0ff;
    }

    .profile-header p {
        color: #b2ebf2;
    }

    .list-group-item {
        background-color: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(0, 255, 255, 0.3);
        border-radius: 8px;
        margin-bottom: 0.5rem;
        color: #e0f7fa;
    }

    .btn-glass {
        background-color: rgba(0, 255, 255, 0.2);
        border: 1px solid rgba(0, 255, 255, 0.5);
        color: #0ff;
        font-weight: 600;
        border-radius: 8px;
        transition: 0.3s;
    }

    .btn-glass:hover {
        background-color: rgba(0, 255, 255, 0.4);
        box-shadow: 0 0 10px #0ff;
        color: #fff;
    }

    .badge-status {
        background-color: #0ff;
        color: #000;
    }

    /* Particle.js container */
    #particles-js {
        position: fixed;
        width: 100%;
        height: 100%;
        z-index: -1;
        top: 0;
        left: 0;
    }
</style>

<body>

    <!-- Particle Background -->
    <div id="particles-js"></div>

    <div class="container py-5">

        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb bg-transparent p-0">
                <li class="breadcrumb-item"><a href="#" class="text-info">Home</a></li>
                <li class="breadcrumb-item active text-white" aria-current="page">Profile Management Dashboard</li>
            </ol>
        </nav>

        <!-- Profile Header -->
        <div class="profile-header glassy-card mb-4">
            <img src="./assets/images/avatar.png" alt="Profile Picture">
            <h2 id="profileName">Isaac Winslow</h2>
            <p id="profileRole">Administrator</p>
            <div class="position-absolute top-0 end-0 p-3">
                <button class="btn btn-light"><i class="fas fa-edit me-2"></i>Edit Cover</button>
            </div>
        </div>

        <!-- Profile Details & Activity -->
        <div class="row g-4">
            <!-- Profile Info -->
            <div class="col-md-6">
                <div class="glassy-card">
                    <h5 class="mb-3">Profile Information</h5>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item"><strong>Email:</strong> <span
                                id="profileEmail">isaac@sunduvault.com</span></li>
                        <li class="list-group-item"><strong>Username:</strong> <span id="profileUsername">isaacw</span>
                        </li>
                        <li class="list-group-item"><strong>Phone:</strong> <span id="profilePhone">+1 234 567
                                890</span></li>
                        <li class="list-group-item"><strong>Status:</strong> <span
                                class="badge badge-status">Active</span></li>
                    </ul>
                    <div class="mt-3 text-center">
                        <button class="btn btn-glass me-2">Edit Profile</button>
                        <button class="btn btn-outline-light">Logout</button>
                    </div>
                </div>
            </div>

            <!-- Security & Settings -->
            <div class="col-md-6">
                <div class="glassy-card">
                    <h5 class="mb-3">Security Settings</h5>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Change Password</label>
                            <input type="password" class="form-control glassy-input" placeholder="Enter new password">
                        </div>
                        <div class="mb-3 form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="enable2FA">
                            <label class="form-check-label" for="enable2FA">Enable Two-Factor Authentication</label>
                        </div>
                        <button class="btn btn-glass w-100">Save Settings</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 60 },
                "color": { "value": "#0ff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5 },
                "size": { "value": 3 },
                "line_linked": { "enable": true, "distance": 150, "color": "#0ff", "opacity": 0.3, "width": 1 },
                "move": { "enable": true, "speed": 2 }
            },
            "interactivity": {
                "events": { "onhover": { "enable": true, "mode": "repulse" }, "onclick": { "enable": true, "mode": "push" } }
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        feather.replace();
    </script>

    <script src="assets/js/main.js"></script>

</body>

</html>
