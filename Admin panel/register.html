<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SunduVault VPN Register</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Particles.js -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

    <style>
        /* CYBER BACKGROUND */
        body {
            background: #0a1a1a;
            color: #00fcfc;
            font-family: "Segoe UI", sans-serif;
            overflow-x: hidden;
        }

        /* PARTICLES */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
        }

        /* GLASS CARD ENHANCED */
        .card {
            background: linear-gradient(135deg,
                    rgba(255, 0, 255, 0.05),
                    rgba(0, 255, 255, 0.05));
            backdrop-filter: blur(8px);
            /* smooth blur effect */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #E5E7EB;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            /* box-shadow: 0 0 40px rgba(0, 252, 252, 0.25); */
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            /* box-shadow: 0 0 40px rgba(0, 252, 252, 0.25); */
        }

        /* INPUTS */
        .form-control {
            background: rgba(0, 30, 50, 0.4);
            border: 1px solid rgba(0, 252, 252, 0.4);
            color: #e0f7fa;
            backdrop-filter: blur(10px);
        }

        .form-control::placeholder {
            color: #99fafa;
        }

        .form-control:focus {
            border-color: #00fcfc;
            box-shadow: 0 0 15px rgba(0, 252, 252, 0.5);
            background: rgba(0, 30, 50, 0.5);
            color: #e0f7fa;
        }

        /* INPUT ICONS */
        .input-group-text {
            background: rgba(0, 30, 50, 0.4);
            border: 1px solid rgba(0, 252, 252, 0.4);
            color: #00fcfc;
        }

        /* BUTTONS */
        .btn-success {
            background: rgba(0, 252, 252, 0.3);
            border: 1px solid rgba(0, 252, 252, 0.7);
            color: #0a1a1a;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-success:hover {
            background: #00fcfc;
            color: #0a1a1a;
            /* box-shadow: 0 0 20px #00fcfc; */
        }

        /* LOGIN LINK */
        .login-link {
            text-decoration: none;
            color: #00fcfc;
            font-weight: 500;
        }

        .login-link:hover {
            color: #fff;
        }

        /* RESPONSIVE */
        @media(max-width:768px) {
            .card {
                padding: 25px;
            }

            h1 {
                font-size: 28px;
            }
        }

        @media(max-width:480px) {
            .btn {
                width: 100%;
                margin-bottom: 10px;
            }
        }

        .text-neon {
            color: white;
            /* text-shadow: 0 0 5px #00fcfc, 0 0 5px #00fcfc; */
        }
    </style>
</head>

<body>
    <!-- PARTICLES -->
    <div id="particles-js"></div>

    <div class="min-vh-100 d-flex align-items-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-7 col-sm-10">
                    <div class="card">
                        <div class="card-body p-4">
                            <h1 class="text-center text-light">Sign Up</h1>
                            <p class="text-center text-neon">Create your SunduVault account</p>
                            <form>

                                <div class="input-group mb-3">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input class="form-control" type="text" placeholder="Username" required>
                                </div>

                                <div class="input-group mb-3">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input class="form-control" type="email" placeholder="Email" required>
                                </div>

                                <div class="input-group mb-3">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input class="form-control" type="password" placeholder="Password" required>
                                </div>

                                <div class="input-group mb-4">
                                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                    <input class="form-control" type="password" placeholder="Repeat password" required>
                                </div>

                                <div class="d-grid">
                                    <button class="btn btn-success" type="submit">Create Account</button>
                                </div>

                                <div class="text-center mt-4 text-light">
                                    Already have an account? <a href="login.html" class="login-link">Login</a>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Particles JS -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            particles: {
                number: { value: 80 },
                color: { value: ["#0ff", "#0f0", "#00f"] },
                shape: { type: "circle" },
                opacity: { value: 0.6 },
                size: { value: 3 },
                line_linked: { enable: true, distance: 150, color: "#0ff", opacity: 0.3, width: 1 },
                move: { enable: true, speed: 2 }
            },
            interactivity: {
                events: {
                    onhover: { enable: true, mode: "repulse" },
                    onclick: { enable: true, mode: "push" }
                }
            }
        });
    </script>
</body>

</html>
