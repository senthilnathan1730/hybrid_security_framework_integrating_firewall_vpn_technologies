<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SunduVault VPN Login</title>
    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Particles.js -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        /* ---------------- BODY ---------------- */
        body {
            background: #0a1a1a;
            color: #e0f7fa;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        /* ---------------- PARTICLES ---------------- */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
        }

        /* ---------------- CARD ---------------- */
        .card {
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.05), rgba(0, 255, 255, 0.05));
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #E5E7EB;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* ---------------- FORM ---------------- */
        .form-control {
            background: rgba(0, 30, 50, 0.4);
            border: 1px solid rgba(0, 252, 252, 0.4);
            color: #e0f7fa;
            backdrop-filter: blur(10px);
        }

        .form-control::placeholder {
            color: #99fafa;
        }

        .form-control:focus {
            border-color: #00fcfc;
            box-shadow: 0 0 15px rgba(0, 252, 252, 0.5);
            background: rgba(0, 30, 50, 0.5);
            color: #e0f7fa;
        }

        .input-group-text {
            background: rgba(0, 30, 50, 0.4);
            border: 1px solid rgba(0, 252, 252, 0.4);
            color: #00fcfc;
        }

        /* ---------------- BUTTONS ---------------- */
        .login-btn {
            background-image: linear-gradient(to right, #00a896, #02c39a);
            color: #fff;
            border: none;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background-image: linear-gradient(to right, #02c39a, #00a896);
        }

        .sign-btn {
            background-image: linear-gradient(to right, #ff5f6d, #ffc371);
            color: #fff;
            border: none;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sign-btn:hover {
            background-image: linear-gradient(to right, #ffc371, #ff5f6d);
        }

        /* ---------------- ERROR / SUCCESS ---------------- */
        .error-message {
            color: #ff4d4d;
            font-size: 0.9rem;
            margin-top: 4px;
            display: none;
        }

        #reset-error {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
        }

        #reset-success {
            color: #00fcfc;
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
        }

        /* ---------------- RESPONSIVE ---------------- */
        @media (max-width:992px) {
            .card-group {
                flex-direction: column;
            }
        }

        @media (max-width:768px) {
            .card {
                padding: 25px;
            }
        }

        @media (max-width:480px) {
            .btn {
                width: 100%;
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body>
    <!-- PARTICLES BACKGROUND -->
    <div id="particles-js"></div>

    <div class="min-vh-100 d-flex align-items-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-xl-8 col-lg-10 col-md-11">
                    <div class="card-group row g-0">
                        <div id="loginError" class="alert alert-danger" style="display:none;"></div>

                        <!-- LOGIN CARD -->
                        <div class="card col-md-7 p-4">
                            <div class="card-body">
                                <h1 class="text-light">Login</h1>
                                <p class="text-center text-neon">Sign in to your VPN dashboard</p>

                                <div class="input-group mb-3">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input id="username" class="form-control" type="text" placeholder="Username">
                                </div>
                                <div class="error-message" id="username-error">Username is required</div>

                                <div class="input-group mb-4">
                                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                    <input id="password" class="form-control" type="password" placeholder="Password">
                                </div>
                                <div class="error-message" id="password-error">Password is required</div>

                                <div class="row g-2 mt-2">
                                    <div class="col-md-6">
                                        <button class="btn login-btn w-100" id="login-btn"
                                            onclick="validateLogin()">Login</button>

                                    </div>
                                    <div class="col-md-6 text-md-end">
                                        <button class="btn btn-link px-0 text-info" data-bs-toggle="modal"
                                            data-bs-target="#forgotPasswordModal">Forgot password?</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- REGISTER PANEL -->
                        <div class="card col-md-5 text-white py-5">
                            <div class="card-body text-center">
                                <h2>Create Account</h2>
                                <p>Join SunduVault VPN platform and secure your connection.</p>
                                <a href="signup.html">
                                    <button class="btn sign-btn w-100">Register Now</button>
                                </a>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content"
                style="background: rgba(0,30,50,0.85); backdrop-filter: blur(10px); color:#e0f7fa; border-radius:16px; border:1px solid rgba(0,252,252,0.3);">
                <div class="modal-header border-0">
                    <h5 class="modal-title" id="forgotPasswordLabel">Reset Password</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Enter your registered email or username to reset your password.</p>
                    <input type="text" id="resetEmail" class="form-control mb-2" placeholder="Email or Username">
                    <div id="reset-error">This field is required</div>
                    <div id="reset-success">Password reset link sent!</div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn login-btn w-100" onclick="sendResetLink()">Send Reset Link</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Particles JS -->
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

    <script>
        // ---------- PARTICLES ----------
        particlesJS("particles-js", {
            particles: {
                number: { value: 80 },
                color: { value: ["#0ff", "#00f", "#0f0"] },
                shape: { type: "circle" },
                opacity: { value: 0.6 },
                size: { value: 3 },
                line_linked: { enable: true, distance: 150, color: "#0ff", opacity: 0.3, width: 1 },
                move: { enable: true, speed: 2 }
            },
            interactivity: {
                events: {
                    onhover: { enable: true, mode: "repulse" },
                    onclick: { enable: true, mode: "push" }
                }
            }
        });


        // ---------- FORGOT PASSWORD ----------
        function sendResetLink() {
            const email = document.getElementById("resetEmail").value.trim();
            const errorDiv = document.getElementById("reset-error");
            const successDiv = document.getElementById("reset-success");

            if (email === "") {
                errorDiv.style.display = "block";
                successDiv.style.display = "none";
            } else {
                errorDiv.style.display = "none";
                successDiv.style.display = "block";
                console.log("Reset link sent to:", email);

                setTimeout(() => {
                    const modalEl = document.getElementById('forgotPasswordModal');
                    const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
                    modal.hide();
                    successDiv.style.display = "none";
                    document.getElementById("resetEmail").value = "";
                }, 2000);
            }
        }
    </script>
    <script>
        async function validateLogin() {

            const usernameField = document.getElementById("username");
            const passwordField = document.getElementById("password");
            const loginBtn = document.getElementById("login-btn");

            const username = usernameField.value.trim();
            const password = passwordField.value.trim();

            if (!username || !password) {
                showError("Username and password are required.");
                return;
            }

            // disable button to prevent multiple clicks
            loginBtn.disabled = true;
            loginBtn.innerText = "Signing in...";

            try {

                const response = await fetch("https://vpn.zeal.lol/api/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.tokens) {

                    // store tokens securely
                    sessionStorage.setItem("access_token", data.tokens.access_token);
                    sessionStorage.setItem("refresh_token", data.tokens.refresh_token);

                    // optional expiry tracking
                    sessionStorage.setItem("token_expiry", Date.now() + (data.tokens.valid_for * 1000));

                    // redirect
                    window.location.replace("index.html");

                } else {

                    showError(data.error || "Invalid login credentials");

                }

            } catch (error) {

                console.error("Login error:", error);
                showError("Unable to connect to authentication server.");

            } finally {

                loginBtn.disabled = false;
                loginBtn.innerText = "Login";

            }
        }
        function showError(message) {

            const errorBox = document.getElementById("loginError");

            errorBox.innerText = message;
            errorBox.style.display = "block";

        }


    </script>


</body>

</html>
